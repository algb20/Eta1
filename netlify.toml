# Netlify configuration for the Eta platform (Next.js static export)
[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# SPA-style fallback so client routing / deep links resolve to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Pi Network requires the validation key to be reachable at the domain root.
[[headers]]
  for = "/validation-key.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
